# Kong Manager on dev signs in with OpenID Connect (Keycloak), added by `make sso`.
# People and their groups (<team>-read-only) live in Keycloak. Each group carries the Kong role in
# Kong's claim format, <workspace>:<role> (payments:workspace-read-only), sent as kong_roles.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      # One issuer for the browser and Kong: tokens say http://127.0.0.1:18080/realms/lab, while
      # Kong's back-channel calls (token, keys) go to keycloak:8080 inside the network.
      KC_HOSTNAME: http://127.0.0.1:18080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run make sso}
      KONG_MANAGER_CLIENT_SECRET: ${KC_CLIENT_SECRET:?run make sso}
      LAB_USER_PASSWORD: ${SSO_USER_PASSWORD:?run make sso}
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:18080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  kong-dev:
    depends_on:
      keycloak: {condition: service_healthy}
    environment:
      KONG_ADMIN_GUI_AUTH: openid-connect
      # Kong reads Keycloak's discovery document over the internal network.
      # cache_tokens false: a sign-in always asks Keycloak, so a changed group counts at once.
      KONG_ADMIN_GUI_AUTH_CONF: >-
        {"issuer": "http://keycloak:8080/realms/lab/.well-known/openid-configuration",
         "client_id": ["kong-manager"], "client_secret": ["${KC_CLIENT_SECRET}"],
         "redirect_uri": ["http://127.0.0.1:18001/auth"],
         "login_redirect_uri": ["http://127.0.0.1:18002"],
         "logout_redirect_uri": ["http://127.0.0.1:18002"],
         "scopes": ["openid", "email", "offline_access"],
         "admin_claim": "email", "authenticated_groups_claim": ["kong_roles"],
         "admin_auto_create": true, "admin_auto_create_rbac_token_disabled": true,
         "cache_tokens": false,
         "session_secret": "${PG_PASSWORD}"}
