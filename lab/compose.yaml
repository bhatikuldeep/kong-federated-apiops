# A licensed Kong Gateway Enterprise 3.16 in traditional mode, one per environment (dev, prod),
# each with its own Postgres database. RBAC is enforced on the Admin API.
name: fapi

x-kong: &kong
  image: kong/kong-gateway:3.16.0.3@sha256:10bc524c16dd8857b8b8d9baa4fa700d7c1fda5e96c5f3fd4ca5b82761589911
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "kong", "health"]
    interval: 5s
    retries: 30

x-kong-env: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: ${PG_PASSWORD:?run make up}
  KONG_LICENSE_DATA: ${KONG_LICENSE_DATA:?set KONG_LICENSE_FILE}
  KONG_PASSWORD: ${KONG_ADMIN_TOKEN:?run make up}
  KONG_ENFORCE_RBAC: both            # endpoint and entity-level RBAC: protects platform plugins
  KONG_ADMIN_LISTEN: 0.0.0.0:8001
  KONG_NGINX_WORKER_PROCESSES: "2"   # two environments share one Postgres in this lab
  KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl    # routes default to https only on 3.16
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr

services:
  # A stand-in for the teams' backend services.
  upstream:
    image: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4

  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run make up}
      POSTGRES_DB: kong_dev
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 3s
      retries: 30

  migrations-dev:
    <<: *kong
    restart: "no"
    healthcheck: {disable: true}
    command: kong migrations bootstrap
    environment: {<<: *kong-env, KONG_PG_DATABASE: kong_dev}

  migrations-prod:
    <<: *kong
    restart: "no"
    healthcheck: {disable: true}
    command: kong migrations bootstrap
    environment: {<<: *kong-env, KONG_PG_DATABASE: kong_prod}

  kong-dev:
    <<: *kong
    depends_on:
      migrations-dev: {condition: service_completed_successfully}
    environment: {<<: *kong-env, KONG_PG_DATABASE: kong_dev}
    ports: ["127.0.0.1:18443:8443", "127.0.0.1:18001:8001"]

  kong-prod:
    <<: *kong
    depends_on:
      migrations-prod: {condition: service_completed_successfully}
    environment: {<<: *kong-env, KONG_PG_DATABASE: kong_prod}
    ports: ["127.0.0.1:19443:8443", "127.0.0.1:19001:8001"]
