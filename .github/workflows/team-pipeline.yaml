# The team pipeline, reusable. Called by teams.yaml in this repository (one repository for all
# teams) or by a team's own repository (see examples/team-repo).
#
# Each environment is a GitHub environment named after it (dev, prod) holding:
#   variable KONG_ADDR                 the environment's Admin API
#   secret   KONG_TOKEN_<TEAM>         that team's pipeline token (terraform output ci_tokens)
#   secret   DECK_<TEAM>_*             values the team's decK files reference
# Protect prod with required reviewers in the environment settings.
name: team-pipeline
on:
  workflow_call:
    inputs:
      team: {type: string, required: true}
      environment: {type: string, required: true}
      deploy: {type: boolean, default: false, description: "false: plan only (pull requests)"}
      team-repository: {type: string, default: "", description: "a team's own repository; empty = teams/<team> here"}
      platform-ref: {type: string, default: "main", description: "version of the platform rules and scripts"}
    secrets:
      KONG_TOKEN: {required: true}
      TEAM_ENV: {required: false, description: "extra DECK_ variables, one NAME=value per line"}

permissions:
  contents: read

jobs:
  validate:
    name: lint and build (${{ inputs.team }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: bhatikuldeep/kong-federated-apiops, ref: "${{ inputs.platform-ref }}", path: platform}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.team-repository != ''
        with: {repository: "${{ inputs.team-repository }}", path: team}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: {working_directory: platform}
      - name: lint-api, build, lint-kong
        working-directory: platform
        env:
          TEAM_DIR: ${{ inputs.team-repository != '' && format('{0}/team', github.workspace) || '' }}
        run: |
          for stage in lint-api build lint-kong; do pipelines/team.sh "${{ inputs.team }}" "$stage"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "kong-${{ inputs.team }}-${{ inputs.environment }}", path: "platform/build/${{ inputs.team }}/kong.yaml"}

  plan-or-deploy:
    name: ${{ inputs.deploy && 'deploy' || 'plan' }} ${{ inputs.team }} to ${{ inputs.environment }}
    needs: validate
    runs-on: ${{ vars.KONG_RUNNER || 'ubuntu-latest' }}   # a runner that can reach the Admin API
    environment: ${{ inputs.environment }}
    concurrency: {group: "kong-${{ inputs.environment }}-${{ inputs.team }}", cancel-in-progress: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: bhatikuldeep/kong-federated-apiops, ref: "${{ inputs.platform-ref }}"}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "kong-${{ inputs.team }}-${{ inputs.environment }}", path: "build/${{ inputs.team }}"}
      - name: validate and diff
        env:
          KONG_ADDR: ${{ vars.KONG_ADDR }}
          KONG_TOKEN: ${{ secrets.KONG_TOKEN }}
          TEAM_ENV: ${{ secrets.TEAM_ENV }}
        run: |
          while IFS= read -r line; do [[ -n $line ]] && export "${line?}"; done <<<"$TEAM_ENV"
          pipelines/team.sh "${{ inputs.team }}" validate
          pipelines/team.sh "${{ inputs.team }}" diff | tee -a "$GITHUB_STEP_SUMMARY"
      - name: sync
        if: inputs.deploy
        env:
          KONG_ADDR: ${{ vars.KONG_ADDR }}
          KONG_TOKEN: ${{ secrets.KONG_TOKEN }}
          TEAM_ENV: ${{ secrets.TEAM_ENV }}
        run: |
          while IFS= read -r line; do [[ -n $line ]] && export "${line?}"; done <<<"$TEAM_ENV"
          pipelines/team.sh "${{ inputs.team }}" sync
