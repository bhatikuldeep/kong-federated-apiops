# The team pipeline. One reusable workflow for every team, called by teams.yaml (all teams in this
# repository) or by a team's own repository (examples/team-repo). Plain decK commands, no scripts.
#
#   mode lint    lint the spec, build the decK file, lint it against the central and team rulesets
#   mode plan    + validate and diff against the environment (pull requests)
#   mode deploy  + sync and a smoke test (merge to main)
#   mode drift   compare the environment with the repository (scheduled)
#
# Call it with `secrets: inherit`. The gateway job runs in the GitHub environment `environment`
# (or `github-environment`) and reads that environment's settings there, so prod secrets stay
# behind the prod environment's rules. <TEAM> and <ENV> are upper case (PAYMENTS, PROD):
#   variables KONG_ADDR_<ENV>, PROXY_URL_<ENV> (smoke test), PROXY_INSECURE (self-signed lab proxy only)
#   secrets   KONG_TOKEN_<TEAM>_<ENV>, TEAM_SECRETS_<TEAM>_<ENV> (JSON of the team's DECK_ variables,
#             e.g. {"DECK_PAYMENTS_WEB_KEY":"..."}), SMOKE_KEY_<TEAM>_<ENV> (an API key for the smoke test)
#   repository: variable KONG_ENABLED=true (no Kong calls without it), optional KONG_RUNNER (a runner
#             label that can reach the Admin API), optional secret REPO_READ_TOKEN (a private platform
#             repository, read from a team's own repository)
name: team-pipeline
on:
  workflow_call:
    inputs:
      team: {type: string, required: true, description: "lower-case letters and digits; also the workspace name"}
      mode: {type: string, required: true, description: "lint, plan, deploy or drift"}
      environment: {type: string, default: "dev", description: "dev or prod: which settings and environments/<env>.yaml"}
      github-environment: {type: string, default: "", description: "the GitHub environment to run in; empty: environment"}
      team-repository: {type: string, default: "", description: "a team's own repository; empty: teams/<team> here"}
      platform-repository: {type: string, default: "", description: "empty: this repository"}
      platform-ref: {type: string, default: ""}

permissions:
  contents: read

defaults:
  run: {shell: bash}   # bash -e -o pipefail: a failing command in a pipe fails the step

jobs:
  lint:
    name: lint and build (${{ inputs.team }})
    runs-on: ubuntu-latest
    outputs:
      team: ${{ steps.names.outputs.team }}
      env: ${{ steps.names.outputs.env }}
    steps:
      # The team name ends up in paths, tags, secret names and shell commands: check it first.
      - id: names
        env: {TEAM: "${{ inputs.team }}", ENVIRONMENT: "${{ inputs.environment }}", MODE: "${{ inputs.mode }}"}
        run: |
          [[ $TEAM =~ ^[a-z][a-z0-9]{0,29}$ ]] || { echo "::error::team must be lower-case letters and digits: $TEAM"; exit 1; }
          [[ $ENVIRONMENT =~ ^(dev|prod)$ ]] || { echo "::error::environment must be dev or prod"; exit 1; }
          [[ $MODE =~ ^(lint|plan|deploy|drift)$ ]] || { echo "::error::mode must be lint, plan, deploy or drift"; exit 1; }
          echo "team=${TEAM^^}" >> "$GITHUB_OUTPUT"; echo "env=${ENVIRONMENT^^}" >> "$GITHUB_OUTPUT"
      # The platform repository at the root (rules and the build action); a team's own repository under team/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.platform-repository == ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.platform-repository != ''
        with: {repository: "${{ inputs.platform-repository }}", ref: "${{ inputs.platform-ref }}", token: "${{ secrets.REPO_READ_TOKEN || github.token }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.team-repository != ''
        with: {repository: "${{ inputs.team-repository }}", path: team}
      - uses: ./.github/actions/build-team
        with: {team: "${{ inputs.team }}", team-dir: "${{ inputs.team-repository != '' && 'team' || format('teams/{0}', inputs.team) }}"}
      # Pull requests: the prod build (with its environment patch) passes the rulesets before merge.
      - uses: ./.github/actions/build-team
        if: inputs.mode == 'plan'
        with: {team: "${{ inputs.team }}", team-dir: "${{ inputs.team-repository != '' && 'team' || format('teams/{0}', inputs.team) }}", environment: prod}
      # Pull requests: a change that breaks existing clients needs a new major version.
      - uses: ./.github/actions/breaking-change
        if: github.event_name == 'pull_request'
        with:
          repo-dir: ${{ inputs.team-repository != '' && 'team' || '.' }}
          spec: ${{ inputs.team-repository != '' && 'openapi.yaml' || format('teams/{0}/openapi.yaml', inputs.team) }}
          base-ref: ${{ github.base_ref }}

  gateway:
    name: ${{ inputs.mode }} ${{ inputs.team }} in ${{ inputs.environment }}
    needs: lint
    if: inputs.mode != 'lint' && vars.KONG_ENABLED == 'true'
    runs-on: ${{ vars.KONG_RUNNER || 'ubuntu-latest' }}   # a runner that can reach the Admin API
    environment: ${{ inputs.github-environment || inputs.environment }}
    # Deploys queue per team and environment; plans and drift runs never cancel a queued deploy.
    concurrency:
      group: ${{ inputs.mode == 'deploy' && format('kong-{0}-{1}', inputs.environment, inputs.team) || format('kong-{0}-{1}-{2}-{3}', inputs.mode, inputs.environment, inputs.team, github.run_id) }}
      cancel-in-progress: false
    env:
      DECK_KONG_ADDR: ${{ vars[format('KONG_ADDR_{0}', needs.lint.outputs.env)] }}
      DECK_HEADERS: "Kong-Admin-Token:${{ secrets[format('KONG_TOKEN_{0}_{1}', needs.lint.outputs.team, needs.lint.outputs.env)] }}"
      DECK_SKIP_WORKSPACE_CRUD: "true"
      WORKSPACE: ${{ inputs.team }}   # one workspace per team; passed as --workspace on every call
      TEAM_SECRETS: ${{ secrets[format('TEAM_SECRETS_{0}_{1}', needs.lint.outputs.team, needs.lint.outputs.env)] }}
      PROXY_URL: ${{ vars[format('PROXY_URL_{0}', needs.lint.outputs.env)] }}
      PROXY_INSECURE: ${{ vars.PROXY_INSECURE }}
    steps:
      # The platform repository at the root (rules and the build action); a team's own repository under team/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.platform-repository == ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.platform-repository != ''
        with: {repository: "${{ inputs.platform-repository }}", ref: "${{ inputs.platform-ref }}", token: "${{ secrets.REPO_READ_TOKEN || github.token }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.team-repository != ''
        with: {repository: "${{ inputs.team-repository }}", path: team}
      - name: Settings for this environment are set
        run: |
          [ -n "$DECK_KONG_ADDR" ] || { echo "::error::variable KONG_ADDR_${{ needs.lint.outputs.env }} is not set for this environment"; exit 1; }
          [ "$DECK_HEADERS" != "Kong-Admin-Token:" ] || { echo "::error::secret KONG_TOKEN_${{ needs.lint.outputs.team }}_${{ needs.lint.outputs.env }} is not set for this environment"; exit 1; }
      - id: build
        uses: ./.github/actions/build-team
        with:
          team: ${{ inputs.team }}
          team-dir: ${{ inputs.team-repository != '' && 'team' || format('teams/{0}', inputs.team) }}
          environment: ${{ inputs.environment }}
      - name: Reach the environment with the team's token
        run: deck gateway ping --workspace "$WORKSPACE"
      - name: Load the team's secrets
        if: env.TEAM_SECRETS != ''
        run: |
          jq -r '.[] | "::add-mask::" + .' <<<"$TEAM_SECRETS"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$TEAM_SECRETS" >> "$GITHUB_ENV"
      - name: Validate against the environment
        if: inputs.mode != 'drift'
        run: deck gateway validate --workspace "$WORKSPACE" "${{ steps.build.outputs.file }}"
      - name: Diff
        if: inputs.mode != 'drift'
        run: deck gateway diff --workspace "$WORKSPACE" "${{ steps.build.outputs.file }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # A rollback point: the team's current config, before this sync. Consumers are left out so no
      # API key ends up in an artifact, so restore it with --skip-consumers (or the sync deletes them):
      #   deck gateway sync --workspace <team> --skip-consumers backup-<team>-<env>.yaml
      - name: Back up the current config
        if: inputs.mode == 'deploy'
        run: deck gateway dump --workspace "$WORKSPACE" --select-tag "team-${{ inputs.team }}" --skip-consumers -o "build/backup-${{ inputs.team }}-${{ inputs.environment }}.yaml" --yes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'deploy' && env.ACT != 'true'   # act's local artifact server can't take v7
        with: {name: "backup-${{ inputs.team }}-${{ inputs.environment }}-${{ github.run_id }}", path: "build/backup-${{ inputs.team }}-${{ inputs.environment }}.yaml", retention-days: 30}
      - name: Sync
        if: inputs.mode == 'deploy'
        run: deck gateway sync --workspace "$WORKSPACE" "${{ steps.build.outputs.file }}"
      - name: Smoke test
        if: inputs.mode == 'deploy' && env.PROXY_URL != ''
        env:
          SMOKE_KEY: ${{ secrets[format('SMOKE_KEY_{0}_{1}', needs.lint.outputs.team, needs.lint.outputs.env)] }}
        run: |
          insecure=(); [ "$PROXY_INSECURE" = true ] && insecure=(--insecure)
          curl --fail --silent --output /dev/null --retry 10 --retry-delay 1 --retry-all-errors "${insecure[@]}" \
            --header "apikey: $SMOKE_KEY" "$PROXY_URL/$WORKSPACE"
      - name: "Drift: managed config differs from the repository"
        if: inputs.mode == 'drift'
        run: deck gateway diff --workspace "$WORKSPACE" --non-zero-exit-code "${{ steps.build.outputs.file }}"
      - name: "Drift: entities created outside the pipelines"
        if: inputs.mode == 'drift' && !cancelled()
        run: |
          deck gateway dump --workspace "$WORKSPACE" -o "build/${{ inputs.team }}/live.yaml" --yes
          deck file lint -s "build/${{ inputs.team }}/live.yaml" --display-only-failures "platform/governance/teams/${{ inputs.team }}.yaml"
