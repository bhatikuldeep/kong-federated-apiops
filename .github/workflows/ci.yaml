# This repository's own checks. No Kong needed; the lab (make test) covers everything that is.
name: ci
on: {pull_request: {}, push: {branches: [main]}}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1.7.1
        with: {deck-version: "1.70.1"}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: "1.17.2", terraform_wrapper: false}
      - name: Terraform format and validate
        working-directory: platform/foundation
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
      - name: The rulesets reject a rogue team
        run: |
          if deck file lint -s tests/fixtures/rogue/openapi.yaml platform/governance/api-rules.yaml; then exit 1; fi
          if deck file lint -s tests/fixtures/rogue/openapi.yaml teams/payments/rules/api-rules.yaml; then exit 1; fi
          deck file openapi2kong -s tests/fixtures/rogue/openapi.yaml -o /tmp/rogue-1.yaml
          deck file add-plugins -s /tmp/rogue-1.yaml -o /tmp/rogue.yaml tests/fixtures/rogue/plugins.yaml
          if deck file lint -s /tmp/rogue.yaml platform/governance/kong-rules.yaml; then exit 1; fi
          if deck file lint -s /tmp/rogue.yaml platform/governance/teams/payments.yaml; then exit 1; fi

  breaking-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: minor
        uses: ./.github/actions/breaking-change
        continue-on-error: true
        with: {spec: tests/fixtures/breaking/openapi.yaml, base-spec: teams/payments/openapi.yaml}
      - id: major
        uses: ./.github/actions/breaking-change
        with: {spec: tests/fixtures/breaking-major/openapi.yaml, base-spec: teams/payments/openapi.yaml}
      - name: A breaking change without a major version is rejected
        if: steps.minor.outcome != 'failure'
        run: exit 1

  list-teams:
    runs-on: ubuntu-latest
    outputs: {teams: "${{ steps.list.outputs.result }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4.54.3
        with: {cmd: "yq -o=json -I=0 '[.teams[].name]' teams.yaml"}

  # Every team, against the central rulesets in this change: a new central rule is checked
  # against all teams before it merges.
  teams:
    needs: list-teams
    strategy: {matrix: {team: "${{ fromJSON(needs.list-teams.outputs.teams) }}"}}
    uses: ./.github/workflows/team-pipeline.yaml
    with: {team: "${{ matrix.team }}", mode: lint}
