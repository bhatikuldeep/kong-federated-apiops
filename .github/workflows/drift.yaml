# Every weekday morning: does each environment still match the repository? A failed job is drift.
# Prod runs in the GitHub environment prod-drift: the same settings as prod, limited to the main
# branch, no reviewers (drift changes nothing, so it shouldn't wait for an approval every morning).
# Settings: as platform.yaml and team-pipeline.yaml, in the dev and prod-drift environments.
name: drift
on:
  schedule: [{cron: "17 6 * * 1-5"}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    if: vars.KONG_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: [{environment: dev, env: DEV, github: dev}, {environment: prod, env: PROD, github: prod-drift}]
    runs-on: ${{ vars.KONG_RUNNER || 'ubuntu-latest' }}
    environment: ${{ matrix.github }}
    defaults:
      run: {working-directory: platform/foundation}
    env:
      TF_VAR_admin_url: ${{ vars[format('KONG_ADDR_{0}', matrix.env)] }}
      TF_VAR_admin_token: ${{ secrets[format('PLATFORM_TOKEN_{0}', matrix.env)] }}
      PG_CONN_STR: ${{ secrets[format('TF_STATE_PG_CONN_{0}', matrix.env)] }}   # the Terraform state backend
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: "1.17.2", terraform_wrapper: false}
      - run: terraform init -input=false
      - run: terraform workspace select -or-create ${{ matrix.environment }}
      - name: "Drift: Kong differs from platform/foundation (exit code 2)"
        run: terraform plan -input=false -lock-timeout=5m -detailed-exitcode

  teams:
    if: vars.KONG_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs: {teams: "${{ steps.list.outputs.result }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4.54.3
        with: {cmd: "yq -o=json -I=0 '[.teams[] | select(.repository == null) | .name]' teams.yaml"}

  dev:
    needs: teams
    if: needs.teams.outputs.teams != '[]'
    strategy: {matrix: {team: "${{ fromJSON(needs.teams.outputs.teams) }}"}, fail-fast: false}
    uses: ./.github/workflows/team-pipeline.yaml
    with: {team: "${{ matrix.team }}", mode: drift, environment: dev}
    secrets: inherit

  prod:
    needs: teams
    if: needs.teams.outputs.teams != '[]'
    strategy: {matrix: {team: "${{ fromJSON(needs.teams.outputs.teams) }}"}, fail-fast: false}
    uses: ./.github/workflows/team-pipeline.yaml
    with: {team: "${{ matrix.team }}", mode: drift, environment: prod, github-environment: prod-drift}
    secrets: inherit
