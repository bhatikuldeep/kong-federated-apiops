# One repository for all teams: run the team pipeline for each team folder a change touches.
# Pull request: plan against dev. Merge to main: deploy dev, then prod (prod waits for the
# reviewers of the prod environment). workflow_dispatch: run one team by hand.
# Settings: see team-pipeline.yaml (environment secrets and variables, read inside the environment).
name: teams
on:
  pull_request: {paths: ["teams/**", "platform/governance/**"]}
  push: {branches: [main], paths: ["teams/**", "platform/governance/**"]}
  workflow_dispatch:
    inputs:
      team: {type: string, required: true}

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs: {teams: "${{ steps.find.outputs.teams }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEAM: ${{ inputs.team }}
        run: |
          if [ -n "$TEAM" ]; then echo "teams=$(jq -nc --arg t "$TEAM" '[$t]')" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "teams=$(git diff --name-only "$BASE" HEAD -- teams | cut -d/ -f2 | sort -u | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  dev:
    needs: [changed]
    if: needs.changed.outputs.teams != '[]'
    strategy: {matrix: {team: "${{ fromJSON(needs.changed.outputs.teams) }}"}, fail-fast: false}
    uses: ./.github/workflows/team-pipeline.yaml
    with:
      team: ${{ matrix.team }}
      mode: ${{ github.event_name == 'pull_request' && 'plan' || 'deploy' }}
      environment: dev
    secrets: inherit

  prod:
    needs: [changed, dev]
    if: github.event_name != 'pull_request' && needs.changed.outputs.teams != '[]'
    strategy: {matrix: {team: "${{ fromJSON(needs.changed.outputs.teams) }}"}, fail-fast: false}
    uses: ./.github/workflows/team-pipeline.yaml
    with:
      team: ${{ matrix.team }}
      mode: deploy
      environment: prod
    secrets: inherit
