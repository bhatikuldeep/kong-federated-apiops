# One-time, per environment, run by hand: the platform pipeline's own RBAC user.
#
# Entity-level RBAC needs its permissions in place before it is enforced, so run this while Kong
# has enforce_rbac = on, then switch Kong to enforce_rbac = both. It:
#   gives the built-in super-admin role a wildcard entity permission (every entity)
#   creates user ci-platform with the super-admin role (its token: secret PLATFORM_TOKEN_<ENV>)
# Not Terraform: Terraform runs as ci-platform, so it can't create its own identity.
# Settings, in the GitHub environment (dev or prod): variable KONG_ADDR_<ENV>; secrets
# SUPER_ADMIN_TOKEN_<ENV> (kong_admin's token, the KONG_PASSWORD of the first migrations bootstrap)
# and PLATFORM_TOKEN_<ENV> (a new random value: ci-platform's token).
name: bootstrap
on:
  workflow_dispatch:
    inputs:
      environment: {type: choice, options: [dev, prod], required: true}

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ${{ vars.KONG_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    env:
      KONG_ADDR: ${{ vars[format('KONG_ADDR_{0}', inputs.environment == 'prod' && 'PROD' || 'DEV')] }}
      SUPER_ADMIN_TOKEN: ${{ secrets[format('SUPER_ADMIN_TOKEN_{0}', inputs.environment == 'prod' && 'PROD' || 'DEV')] }}
      PLATFORM_TOKEN: ${{ secrets[format('PLATFORM_TOKEN_{0}', inputs.environment == 'prod' && 'PROD' || 'DEV')] }}
    steps:
      - name: Settings for this environment are set
        run: |
          for v in KONG_ADDR SUPER_ADMIN_TOKEN PLATFORM_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v is not set for ${{ inputs.environment }}"; exit 1; }
          done
      - name: The super admin sees every entity
        run: >-
          curl --fail-with-body -sS -H "Kong-Admin-Token: $SUPER_ADMIN_TOKEN" "$KONG_ADDR/rbac/roles/super-admin/entities"
          --json '{"entity_id":"*","entity_type":"wildcard","actions":"read,create,update,delete"}'
      - name: User ci-platform
        run: >-
          jq -n --arg t "$PLATFORM_TOKEN" '{name: "ci-platform", user_token: $t, comment: "The platform pipeline."}'
          | curl --fail-with-body -sS -o /dev/null -H "Kong-Admin-Token: $SUPER_ADMIN_TOKEN" "$KONG_ADDR/rbac/users" --json @-
      - name: "  has the built-in role super-admin"
        run: >-
          curl --fail-with-body -sS -H "Kong-Admin-Token: $SUPER_ADMIN_TOKEN" "$KONG_ADDR/rbac/users/ci-platform/roles"
          --json '{"roles":"super-admin"}'
