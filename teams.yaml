# The team registry: the file the platform team edits to onboard a team (docs/production.md, "Add a
# team"). Terraform (platform/foundation) creates a Kong workspace with the same name. Each team also
# needs a rules file you add, platform/governance/teams/<name>.yaml, that the team pipeline and the
# drift job lint against. Names: lower-case letters and digits.
# A team with its own repository gets `repository: <org>/<repo>`: Terraform still creates its
# workspace and token here, while CI and drift in this repository skip it (its repository runs
# them; docs/federation-model.md, "Split a team into its own repository").
teams:
  - name: payments
  - name: orders
