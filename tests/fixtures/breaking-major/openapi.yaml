# The same breaking change, released as a new major version: allowed. For make test and ci.
openapi: 3.0.3
info:
  title: Payments API
  version: 2.0.0
  description: Create and look up payments.
  contact: {name: Payments team, email: payments-team@example.com}
servers:
  - url: http://upstream:8080/anything/payments
security:
  - apiKey: []
tags:
  - name: payments
paths:
  /payments:
    get:
      operationId: list-payments
      summary: List payments
      tags: [payments]
      responses:
        "200": {description: The payments.}
        "401": {description: No or wrong API key.}
    post:
      operationId: create-payment
      summary: Create a payment
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Payment"}
      responses:
        "201": {description: Created.}
        "401": {description: No or wrong API key.}
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: apikey}
  schemas:
    Payment:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: integer, minimum: 1, maximum: 1000000}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
