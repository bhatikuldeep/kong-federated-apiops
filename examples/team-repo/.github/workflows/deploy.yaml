# In a team's own repository (one repository per team): openapi.yaml, plugins.yaml and
# consumers.yaml at the root, optionally rules/ with the team's own rulesets, and this workflow.
# The pipeline and the central rulesets come from the platform repository at a pinned version.
# Replace example-org/kong-platform (four places), v1.0.0 (four places) and the team name (twice).
# Settings: as team-pipeline.yaml describes, in this repository's dev, prod and prod-drift
# environments, plus the repository variable KONG_ENABLED=true.
name: deploy
on:
  pull_request: {}
  push: {branches: [main]}
  schedule: [{cron: "17 6 * * 1-5"}]   # drift: does each environment still match this repository?

permissions:
  contents: read

jobs:
  dev:
    uses: example-org/kong-platform/.github/workflows/team-pipeline.yaml@v1.0.0
    with:
      team: payments
      mode: ${{ github.event_name == 'pull_request' && 'plan' || github.event_name == 'schedule' && 'drift' || 'deploy' }}
      environment: dev
      team-repository: ${{ github.repository }}
      platform-repository: example-org/kong-platform
      platform-ref: v1.0.0
    secrets: inherit

  prod:
    needs: dev
    # deploy: only after dev succeeded; drift: check prod even when dev drifted
    if: (github.event_name == 'push' && success()) || (github.event_name == 'schedule' && !cancelled())
    uses: example-org/kong-platform/.github/workflows/team-pipeline.yaml@v1.0.0
    with:
      team: payments
      mode: ${{ github.event_name == 'schedule' && 'drift' || 'deploy' }}
      environment: prod
      github-environment: ${{ github.event_name == 'schedule' && 'prod-drift' || 'prod' }}
      team-repository: ${{ github.repository }}
      platform-repository: example-org/kong-platform
      platform-ref: v1.0.0
    secrets: inherit
