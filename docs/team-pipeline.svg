    .kbd-u { fill: none; stroke: #6366f1; stroke-width: 2; stroke-linejoin: round; }
    .kbd-r { fill: none; stroke: var(--accent, #007a52); stroke-width: 2.4; stroke-dasharray: 12 7; stroke-linejoin: round; }
    .kbd-o { fill: none; stroke: var(--muted, #8a8f98); stroke-width: 2.4; stroke-dasharray: 1 6; stroke-linecap: round; stroke-linejoin: round; }
    .dark .kbd-u { stroke: #818cf8; }
    .kbd-warn { fill: var(--entry, #ffffff); stroke: #c2410c; stroke-width: 1.5; }
    .kbd-tw { fill: #c2410c; font-size: 22px; font-weight: 600; text-anchor: middle; }
    .kbd-lg { fill: var(--secondary, #4a4f57); font-size: 15px; }
