<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 512" width="1220" height="512" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <style>
    .kbd-bg { fill: var(--entry, #ffffff); }
