# Central platform rules (platform team), for the decK file each team pipeline builds. They close
# the gaps RBAC can't: Kong's RBAC sees every plugin write as /plugins, so these rules decide which
# plugins a team may add and where. A team can add its own rules in rules/kong-rules.yaml.
rules:
  allowed-plugins:
    description: Teams use plugins from the platform's list only. The mandatory plugins
      (correlation-id, request-size-limiting, rate-limiting) aren't on it, so a team can't
      replace them on its own services or routes.
    given: $..plugins[*].name
    severity: error
    message: "plugin is not on the platform's allowed list"
    then:
      function: enumeration
      functionOptions:
        values: [key-auth, acl, cors, request-transformer, response-transformer, rate-limiting-advanced, request-validator]
  no-global-plugins:
    description: Global plugins belong to the platform.
    given: $
    severity: error
    message: top-level (global) plugins are reserved for the platform team
    then: {field: plugins, function: undefined}
  no-plugin-ordering:
    description: Dynamic ordering could run a team plugin ahead of the platform's.
    given: $..plugins[*]
    severity: error
    message: the ordering field is reserved for the platform team
    then: {field: ordering, function: undefined}
  no-plugin-condition:
    description: A condition expression could switch a plugin off for some requests.
    given: $..plugins[*]
    severity: warn
    message: plugin conditions need a platform review
    then: {field: condition, function: undefined}
  https-only-routes:
    description: Routes accept TLS only (Kong's default since 3.14; don't turn plain HTTP back on).
    given: $..routes[*].protocols[*]
    severity: error
    message: routes must not accept plain http
    then: {function: enumeration, functionOptions: {values: [https, grpcs, tls]}}
  key-auth-hides-credentials:
    description: The API key isn't forwarded to the backend.
    given: $..plugins[?(@.name == 'key-auth')].config
    severity: error
    message: "key-auth must set hide_credentials to true"
    then: {field: hide_credentials, function: truthy}
  upstream-tls:
    description: Kong calls backends over TLS.
    given: $.services[*]
    severity: warn
    message: the service should use https to its backend
    then: {field: protocol, function: pattern, functionOptions: {match: '^https$'}}
