# Rules for team orders (platform-owned). The team pipeline lints its built decK file with them, and
# the drift workflow lints a dump of the team's workspace with them.
rules:
  route-prefix:
    description: The team's routes stay under /orders.
    given: $..routes[*].paths[*]
    severity: error
    message: "routes of team orders must start with /orders"
    then:
      function: pattern
      functionOptions: {match: "^~?/orders([/$]|$)"}
  owned:
    description: Every entity carries the team's tag. Anything else was created outside the
      pipelines. (The platform's global plugins are checked by global-plugins-are-mandatory.)
    given:
      - "$.services[*]"
      - "$..routes[*]"
      - "$.services[*].plugins[*]"
      - "$..routes[*].plugins[*]"
      - "$.consumers[*]"
      - "$.consumers[*].plugins[*]"
      - "$.consumer_groups[*]"
      - "$.consumer_groups[*].plugins[*]"
      - "$.upstreams[*]"
      - "$.certificates[*]"
      - "$.ca_certificates[*]"
      - "$..snis[*]"
      - "$.keys[*]"
      - "$.key_sets[*]"
      - "$.vaults[*]"
      - "$.partials[*]"
    severity: error
    message: "created outside the pipelines (no team-orders tag)"
    then:
      - {field: tags, function: defined}
      - field: tags
        function: schema
        functionOptions:
          schema: {type: array, contains: {const: team-orders}}
  global-plugins-are-mandatory:
    description: The only global plugins are the platform's mandatory ones, tagged platform and
      scoped to nothing. Teams never ship global plugins (kong-rules), so any other is a hand edit.
    given: "$.plugins[*]"
    severity: error
    message: "a global plugin that isn't one of the platform's mandatory plugins"
    then:
      - field: name
        function: pattern
        functionOptions: {match: "^(correlation-id|request-size-limiting|rate-limiting)$"}
      - {field: tags, function: defined}
      - field: tags
        function: schema
        functionOptions:
          schema: {type: array, contains: {const: platform}}
      - {field: service, function: undefined}
      - {field: route, function: undefined}
      - {field: consumer, function: undefined}
      - {field: consumer_group, function: undefined}
  platform-tag-only-on-global-plugins:
    description: The platform's plugins are global. A plugin on a service, route or consumer that
      carries the platform tag was created to look like one.
    given: ["$.services[*].plugins[*]", "$..routes[*].plugins[*]", "$.consumers[*].plugins[*]", "$.consumer_groups[*].plugins[*]"]
    severity: error
    message: "only global plugins may carry the platform tag"
    then:
      field: tags
      function: schema
      functionOptions:
        schema: {not: {contains: {const: platform}}}
  no-mandatory-override:
    description: A mandatory plugin's name on a service, route or consumer replaces the platform's
      global one for that traffic, whatever it's tagged.
    given: ["$.services[*].plugins[*].name", "$..routes[*].plugins[*].name", "$.consumers[*].plugins[*].name", "$.consumer_groups[*].plugins[*].name"]
    severity: error
    message: "overrides a mandatory plugin"
    then:
      function: pattern
      functionOptions: {notMatch: "^(correlation-id|request-size-limiting|rate-limiting)$"}
